name: redpanda-quickstart-one-broker

networks:
  redpanda_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

services:

  # ─────────────────────────────────────────────
  # 1. POSTGRESQL
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - redpanda_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d mydatabase"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 2. PGADMIN 
  # ─────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    networks:
      - redpanda_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 3. REDPANDA
  # ─────────────────────────────────────────────
  redpanda-0:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda-0:33145
      - --advertise-rpc-addr redpanda-0:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
    container_name: redpanda-0
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - 18081:18081
      - 18082:18082
      - 19092:19092
      - 19644:9644
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 4. REDPANDA CONSOLE
  # ─────────────────────────────────────────────
  console:
    container_name: redpanda-console
    image: docker.redpanda.com/redpandadata/console:v3.1.3
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - 8080:8080
    depends_on:
      redpanda-0:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 5. DEBEZIUM CONNECT
  # ─────────────────────────────────────────────
  debezium-connector:
    image: debezium/connect:2.1
    container_name: debezium-connector
    environment:
      BOOTSTRAP_SERVERS: redpanda-0:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_PARTITIONS: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_PARTITIONS: "1"
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      PLUGIN_PATH: /kafka/connect/debezium-connector
    ports:
      - "8083:8083"
    networks:
      - redpanda_network
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-0:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 6. DEBEZIUM INIT — one-shot, enregistre le connecteur
  # ─────────────────────────────────────────────
  debezium-init:
    image: curlimages/curl:latest
    container_name: debezium-init
    networks:
      - redpanda_network
    depends_on:
      debezium-connector:
        condition: service_healthy
    volumes:
      - ./config/debezium.json:/config/connector.json:ro
    # Vérifie si le connecteur existe déjà avant de l'enregistrer (idempotent)
    command: |
      sh -c "
        echo 'Checking if connector already exists...';
        STATUS=$$(curl -s -o /dev/null -w '%{http_code}' http://debezium-connector:8083/connectors/postgresql-connector);
        if [ \"$$STATUS\" = '200' ]; then
          echo 'Connector already registered, skipping.';
        else
          echo 'Registering Debezium connector...';
          curl -X POST http://debezium-connector:8083/connectors -H 'Content-Type: application/json' -d @/config/connector.json;
          echo 'Connector registered successfully.';
        fi
      "
    restart: "no"

  # ─────────────────────────────────────────────
  # 7. CONSUMER DISCORD
  # ─────────────────────────────────────────────
  discord-consumer:
    build:
      context: .
      dockerfile: discord_consumer/Dockerfile
    container_name: discord-consumer
    networks:
      - redpanda_network
    depends_on:
      redpanda-0:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: redpanda-0:9092
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}   # via .env
      KAFKA_TOPIC: ${TICKER_TOPIC:-topic_activities.public.activities}
      DISCORD_INTERVAL: ${DISCORD_INTERVAL:-300}
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 8. SPARK MASTER
  # ─────────────────────────────────────────────
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    networks:
      - redpanda_network
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - '7077:7077'
      - '9090:8080'
    volumes:
      - spark_master_data:/opt/spark/work
      - delta_data:/opt/spark/delta
      - ./powerbi_data:/opt/spark/powerbi_data
      - ./Inputs:/opt/spark/inputs:ro
    environment:
      - SPARK_NO_DAEMONIZE=true
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      redpanda-0:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 9. SPARK WORKER
  # ─────────────────────────────────────────────
  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    networks:
      - redpanda_network
    user: root
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=1G
      - SPARK_WORKER_CORES=2
    ports:
      - '9091:8081'
    volumes:
      - spark_worker_data:/opt/spark/work
      - delta_data:/opt/spark/delta
      - ./powerbi_data:/opt/spark/powerbi_data
      - ./Inputs:/opt/spark/inputs:ro
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # 10. SPARK Bronze — lance ton pipeline Delta Lake
  # ─────────────────────────────────────────────

  spark-consumer:
    build:
      context: .
      dockerfile: spark_job/Dockerfile
    container_name: spark-consumer
    networks:
      - redpanda_network
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    environment:
      SPARK_MASTER: spark://spark-master:7077
      BOOTSTRAP_SERVERS: redpanda-0:9092
      KAFKA_TOPIC: ${TICKER_TOPIC:-topic_activities.public.activities}
      DELTA_PATH: /opt/spark/delta
    volumes:
      - delta_data:/opt/spark/delta
      - ./Inputs:/opt/spark/app/config/inputs:ro
    entrypoint: ["/opt/spark/app/entrypoint_bronze.sh"]
    restart: on-failure

  # ─────────────────────────────────────────────
  # 11. SPARK Silver - Gold — lance ton pipeline Delta Lake
  # ─────────────────────────────────────────────
  spark-submit-job:
    build:
      context: .
      dockerfile: spark_job/Dockerfile
    container_name: spark-submit-job
    networks:
      - redpanda_network
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    environment:
      SPARK_MASTER: spark://spark-master:7077
      BOOTSTRAP_SERVERS: redpanda-0:9092
      KAFKA_TOPIC: ${TICKER_TOPIC:-topic_activities.public.activities}
      DELTA_PATH: /opt/spark/delta
      POWERBI_PATH: /opt/spark/powerbi_data
      MEDALLION_MODE: watch
      MEDALLION_INTERVAL: "120"
    volumes:
      - delta_data:/opt/spark/delta
      - ./powerbi_data:/opt/spark/powerbi_data
      - ./Inputs:/opt/spark/app/config/inputs
    entrypoint: ["/opt/spark/app/entrypoint.sh"]
    restart: on-failure

volumes:
  postgres_data: {}
  redpanda-0: null
  spark_master_data: {}
  spark_worker_data: {}
  delta_data: {}